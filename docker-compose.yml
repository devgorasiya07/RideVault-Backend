services:
  postgres:
    image: postgres:16-alpine
    container_name: ridevault-postgres
    environment:
      POSTGRES_DB: ridevault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - ridevault_pgdata:/var/lib/postgresql/data
      - ./database/DDL.sql:/docker-entrypoint-initdb.d/01-DDL.sql:ro
      - ./database/DataInsertion.sql:/docker-entrypoint-initdb.d/02-DataInsertion.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ridevault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ridevault_pgdata:
